name: Awesome Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  awesome-lint:
    name: Lint awesome list
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run awesome-lint
        run: npx awesome-lint
